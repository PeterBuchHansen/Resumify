[package]
name = "editor-server"
version = "0.1.0"
edition = "2021"
description = "HTTP server for editor.html: static files + Typst compile API"

[[bin]]
name = "editor-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
socket2 = "0.5"
