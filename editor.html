<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Resume editor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="view/styles/app.css">
</head>
<body class="page-editor">
  <div class="frame">
    <header class="site-header">
      <div class="header-lead">
        <h1>Resume editor</h1>
        <p class="status" id="status" aria-live="polite"></p>
      </div>
      <div class="actions">
        <a href="index.html" class="nav" title="Back to resume preview">Home</a>
      </div>
    </header>
    <main class="split">
      <div class="pane editor">
        <div class="editor-toolbar" role="tablist" aria-label="Editor mode">
          <button type="button" class="editor-tool" role="tab" id="tab-sidebar" aria-selected="false" aria-pressed="false" title="Skills &amp; languages (YAML)" aria-label="Skills and languages">
            <svg class="editor-tool-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
          </button>
          <span class="toolbar-sep" aria-hidden="true"></span>
          <button type="button" class="editor-tool" role="tab" id="tab-header" aria-selected="false" aria-pressed="false" title="Orange band: header, subheader, rule, contact" aria-label="Header">
            <svg class="editor-tool-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/></svg>
          </button>
          <span class="toolbar-sep" aria-hidden="true"></span>
          <button type="button" class="editor-tool active" role="tab" id="tab-main" aria-selected="true" aria-pressed="true" title="Main column text (Typst)" aria-label="Main content">
            <svg class="editor-tool-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
          </button>
        </div>
        <div class="editor-body">
        <div id="mainEdit">
          <label for="src" class="editor-pane-label">Content editor (Typst)</label>
          <textarea id="src" spellcheck="false" aria-label="Resume content column (Typst)"></textarea>
        </div>
        <div id="headerEdit" hidden>
          <label for="header-src" class="editor-pane-label">Header editor (Typst)</label>
          <textarea id="header-src" spellcheck="false" aria-label="Resume header band (Typst)"></textarea>
        </div>
        <div id="sidebarEdit" hidden>
          <span class="editor-pane-label">
            Sidebar editor (YAML <i class="fa-solid fa-arrow-right yaml-typst-flow-icon" aria-hidden="true"></i> Typst)
          </span>
          <div class="sidebar-edit-body">
            <div class="sidebar-photo-section">
              <div id="photo-drop" class="photo-drop-zone" role="button" tabindex="0" aria-label="Drop or choose sidebar photo">
                <span class="photo-drop-hint">Drop photo here, or click to choose</span>
                <button type="button" id="photo-delete" class="photo-delete-overlay" hidden aria-label="Remove photo">
                  <i class="fa-solid fa-trash" aria-hidden="true"></i>
                </button>
              </div>
              <input type="file" id="photo-file" accept="image/*" hidden />
            </div>
            <fieldset>
              <legend>SoMe Profiles</legend>
              <div id="profilesMount"></div>
              <button type="button" id="addProfile" class="btn-sidebar-add btn-sidebar-add--gap">+ Add profile link</button>
            </fieldset>
            <fieldset>
              <legend>Languages</legend>
              <div id="languagesMount"></div>
              <button type="button" id="addLanguage" class="btn-sidebar-add btn-sidebar-add--gap">+ Add language</button>
            </fieldset>
            <fieldset>
              <legend>Certifications</legend>
              <div id="certificationsMount"></div>
              <button type="button" id="addCertification" class="btn-sidebar-add btn-sidebar-add--gap">+ Add certification</button>
            </fieldset>
            <div class="skills-section-head">
              <h2>Skills</h2>
              <label class="references-show-contact-label skills-show-ratings-label">
                <input type="checkbox" id="skills-show-ratings" checked />
                Show ratings in PDF
              </label>
            </div>
            <div id="skillsMount"></div>
            <button type="button" id="addCategory" class="btn-sidebar-add btn-sidebar-add--gap">+ Add skill category</button>
            <fieldset>
              <legend>Awards</legend>
              <div id="awardsMount"></div>
              <button type="button" id="addAward" class="btn-sidebar-add btn-sidebar-add--gap">+ Add award</button>
            </fieldset>
            <fieldset class="references-fieldset">
              <legend class="references-legend">
                <span class="references-legend-title">References</span>
                <label class="references-show-contact-label references-show-contact-label--legend">
                  <input type="checkbox" id="references-show-contact" checked />
                  Show phone &amp; link in PDF
                </label>
              </legend>
              <div id="referencesMount"></div>
              <button type="button" id="addReference" class="btn-sidebar-add btn-sidebar-add--gap">+ Add reference</button>
            </fieldset>
          </div>
        </div>
        </div>
      </div>
      <div class="pane">
        <div class="viewer-wrap">
          <iframe id="pdf" src="resume.pdf" title="Resume PDF"></iframe>
        </div>
      </div>
    </main>
    <footer class="site-footer" aria-hidden="true"></footer>
  </div>
  <div id="compile-toast" class="compile-toast" hidden role="status" aria-live="polite" aria-atomic="true">
    <div class="compile-toast-title" id="compile-toast-title">Typst compile error</div>
    <pre id="compile-toast-text" class="compile-toast-text"></pre>
  </div>
  <script src="view/editor.js" defer></script>
</body>
</html>
